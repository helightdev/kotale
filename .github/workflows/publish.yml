name: Publish Packages

on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      KOTALE_USER: ${{ secrets.KOTALE_USER }}
      KOTALE_KEY: ${{ secrets.KOTALE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadow JAR
        run: ./gradlew shadowJar -x test

      - name: Publish to Maven Repositories
        run: ./gradlew publish -x test
        env:
          BUILD_VERSION: ${{ github.ref_name }}

      - name: Move jars to release folder
        run: |
          mkdir release
          mv mods/kotlin/build/libs/*-all.jar release/kotlin.jar
          mv mods/kotale/build/libs/*-all.jar release/kotale.jar
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}